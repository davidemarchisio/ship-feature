name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # macOS validates the Bash 3.2 target that Ubuntu's Bash 5 cannot.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Test the exact reviewed code — the PR head SHA, not GitHub's synthetic merge commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      # shellcheck and shfmt at the versions mise.toml pins: bin/ci refuses any other version.
      # Pinned to an immutable commit SHA.
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
      - name: bin/ci (syntax, shellcheck, shfmt, leak scan, tests)
        # The script the pre-push hook runs, so a push and CI check the same things.
        # The suite isolates its fixtures from the ambient git environment with GIT_CONFIG_COUNT,
        # which needs git 2.31+. It refuses to run on anything older rather than half-applying the
        # isolation and reporting green; both runner images are well past that.
        env:
          CI_MODE: full
        run: |
          git --version
          bin/ci

  secrets:
    runs-on: ubuntu-latest
    # Runs on fork PRs too: the read-only GITHUB_TOKEN is enough for gitleaks-action to scan and fail the
    # job on findings (it just can't post a PR comment) — and forks are exactly where scanning matters.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      # Generic secret scanner (complements scan-generic.sh, which covers emails/home paths). Free for
      # individual accounts and public repos. Pinned to an immutable commit SHA (gitleaks-action v2).
      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
